<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starred Intelligence</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --surface: #12192b;
      --surface-2: #0f1627;
      --line: rgba(148, 163, 184, 0.14);
      --text: #e6eaf2;
      --muted: #9aa4b2;
      --accent: #7aa2ff;
      --ok: #36cfc9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", "PingFang SC", system-ui, sans-serif;
      background: radial-gradient(1000px 500px at 30% -25%, #182446 0%, var(--bg) 60%);
      color: var(--text);
      line-height: 1.5;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      min-height: 100vh;
      padding: 16px;
    }
    .sidebar,
    .panel,
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .sidebar {
      padding: 16px;
      position: sticky;
      top: 16px;
      height: calc(100vh - 32px);
      overflow: auto;
    }
    h1 { margin: 0 0 4px; font-size: 22px; line-height: 30px; font-weight: 600; }
    h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
    .muted { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .field { margin-bottom: 12px; }
    .label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    input, select, button {
      width: 100%;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--surface-2);
      padding: 0 10px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .btn-row.single { grid-template-columns: 1fr; }
    .main {
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      gap: 12px;
      min-width: 0;
    }
    .topbar {
      background: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .title-wrap { display: flex; flex-direction: column; gap: 2px; }
    .title-wrap p { margin: 0; color: var(--muted); font-size: 13px; }
    .account-badge {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: #dbe7ff;
      padding: 8px 12px;
      font-size: 13px;
      white-space: nowrap;
    }
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .status {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .kpi {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 10px;
    }
    .kpi-card { padding: 12px; }
    .k-label { font-size: 12px; color: var(--muted); }
    .k-value { font-size: 30px; line-height: 36px; font-weight: 600; margin-top: 4px; }
    .k-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .panel { padding: 12px; min-width: 0; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .tag {
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      font-size: 11px;
      padding: 2px 8px;
    }
    .insight { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    #pie, #bar { height: 240px; }
    .list-panel { padding: 12px; }
    .list-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .table-head,
    .repo-row {
      display: grid;
      grid-template-columns: minmax(260px, 1.35fr) 120px minmax(420px, 2fr);
      gap: 12px;
      align-items: start;
    }
    .table-head {
      font-size: 12px;
      color: var(--muted);
      padding: 0 8px 8px;
      border-bottom: 1px solid var(--line);
    }
    #listWrap { max-height: calc(100vh - 460px); overflow: auto; }
    .repo-row {
      padding: 12px 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      font-size: 14px;
    }
    .repo-row:hover { background: rgba(122, 162, 255, 0.04); }
    .repo-row:last-child { border-bottom: 0; }
    .repo-title { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
    a { color: #9dbdff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .repo-meta { color: var(--muted); font-size: 12px; }
    .desc-en { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .desc-cn { display: none; margin-top: 6px; color: #b9ece8; font-size: 13px; }
    .repo-row.expanded .desc-cn { display: block; }
    .pill {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      padding: 1px 7px;
      margin-top: 4px;
    }
    .error { color: #ff9f9f; font-size: 13px; min-height: 20px; margin-bottom: 6px; }
    @media (max-width: 1200px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .kpi { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
      .charts { grid-template-columns: 1fr; }
      .table-head, .repo-row { grid-template-columns: 1fr; }
      #listWrap { max-height: 68vh; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Starred Intelligence</h1>
      <p class="muted">阅读优先型布局：低疲劳、强层级、强洞察。</p>
      <div class="btn-row"><button id="manualRefresh">立即刷新</button><button id="clearCredentials">清除缓存</button></div>
      <div class="field"><label class="label" for="source">数据源</label><select id="source"><option value="merged">全部账号合并</option></select></div>
      <div class="field"><label class="label" for="kw">关键词</label><input id="kw" placeholder="仓库名 / 简介关键词" /></div>
      <div class="field"><label class="label" for="lang">语言分类</label><select id="lang"><option value="">全部分类</option></select></div>
      <div class="field"><label class="label" for="descType">简介类型</label><select id="descType"><option value="">全部</option><option value="en">仅英文</option><option value="zh">含中文</option><option value="empty">暂无简介</option></select></div>
      <div class="btn-row single"><button id="expandAll">展开中文补充</button></div>
      <div class="btn-row single"><button id="collapseAll">收起中文补充</button></div>
      <p class="muted" id="sourceInfo">实时模式已启用</p>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="title-wrap">
          <h2>GitHub Starred Repositories Dashboard</h2>
          <p id="filterSummary">当前：全部账号合并</p>
        </div>
        <div class="account-badge" id="currentAccountBadge">当前账号：全部账号合并</div>
      </div>

      <div class="status-grid">
        <div class="status" id="liveStatus">最近更新: -- ｜ 下次刷新: --:-- ｜ 空闲</div>
        <div class="status" id="diffInfo">本次变化: +0 / -0</div>
      </div>

      <section class="kpi" id="kpi"></section>

      <section class="charts">
        <div class="panel">
          <div class="panel-head"><h2>语言分布</h2><span class="tag">Composition</span></div>
          <div id="pie"></div>
          <p class="insight" id="pieInsight">正在生成洞察...</p>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Top 语言分类</h2><span class="tag">Ranking</span></div>
          <div id="bar"></div>
          <p class="insight">仅展示前 10 类，便于快速聚焦。</p>
        </div>
      </section>

      <section class="panel list-panel">
        <div class="error" id="errorInfo"></div>
        <div class="list-toolbar">
          <div>仓库清单</div>
          <div id="resultCount">0 项</div>
        </div>
        <div class="table-head">
          <div>仓库</div>
          <div>语言</div>
          <div>简介（英文原文 + 中文补充）</div>
        </div>
        <div id="listWrap"><div id="list"></div></div>
      </section>
    </main>
  </div>
  <script src="./js/github-api.js"></script>
  <script src="./js/security.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/refresh-controller.js"></script>
  <script src="./js/view.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
